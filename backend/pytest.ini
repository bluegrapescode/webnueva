[pytest]
# Fixed 2 xdist workers (deterministic). loadscope pins each test class/module
# to one worker - the suites share one preview backend and assume sequential
# shared state - so this parallelizes across classes/modules without
# cross-test races. Serial run = `-n 0` (do NOT use `-p no:xdist`, which
# errors because addopts still passes -n/--dist).
required_plugins = pytest-xdist
addopts = -n 2 --dist loadscope
